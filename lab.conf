# What the platform needs to know, as data: KEY=value lines, nothing else. It is never run: no $,
# no functions, no commands. Nothing here names your app: the platform knows its name, gives it
# its address (<name>.apps.oerba.dev) and keeps BACKUP's folders inside its own data folder.
COMPOSE=compose.yaml
HEALTH=http://127.0.0.1:8897/healthz
TIER=small                      # small, medium, large or gpu: the most of the machine it may use
BACKUP=data                     # its data folder's data/, copied every night
LINKS="db:postgres"
BACKUP_DUMP="db postgres"
